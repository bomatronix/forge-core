name: Deploy — Staging → Prod

on:
  push:
    branches: [main]

jobs:
  # ── Phase 1: CI checks ───────────────────────────────────────────────────────
  checks:
    uses: ./.github/workflows/shared-checks.yml

  # ── Phase 2: Detect which workspaces need deploying ──────────────────────────
  detect-changes:
    name: Detect Changed Workspaces
    runs-on: ubuntu-latest
    needs: [checks]
    outputs:
      matrix_staging: ${{ steps.staging.outputs.matrix || '[]' }}
      matrix_prod: ${{ steps.prod.outputs.matrix || '[]' }}
      has_changes: ${{ (steps.staging.outputs.matrix || '[]') != '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            libs:
              - 'libs/**'
            apps:
              - 'apps/**'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build staging matrix
        id: staging
        env:
          DEPLOY_ENV: staging
          CHANGED_FILES: "${{ steps.filter.outputs.libs_files }} ${{ steps.filter.outputs.apps_files }}"
          LIBS_CHANGED: "${{ steps.filter.outputs.libs }}"
        run: |
          matrix="$(node .github/scripts/build-matrix.js)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Build prod matrix
        id: prod
        env:
          DEPLOY_ENV: prod
          CHANGED_FILES: "${{ steps.filter.outputs.libs_files }} ${{ steps.filter.outputs.apps_files }}"
          LIBS_CHANGED: "${{ steps.filter.outputs.libs }}"
        run: |
          matrix="$(node .github/scripts/build-matrix.js)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ── Phase 3: Build + deploy to staging ───────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging (${{ matrix.client }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: (needs.detect-changes.outputs.matrix_staging || '[]') != '[]'
    environment: staging
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix_staging || '[]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all apps in workspace
        run: |
          for app in ${{ join(matrix.apps, ' ') }}; do
            echo "Building $app..."
            APP=$app pnpm build:app
          done
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.role_to_assume }}
          aws-region: ${{ matrix.region }}
      - name: Upload Lambda zips to S3
        env:
          CLIENT: ${{ matrix.client }}
          S3_BUCKET: ${{ matrix.s3_bucket }}
          S3_KMS_KEY_ID: ${{ matrix.kms_key_id }}
          LAMBDA_KEY_PREFIX: ${{ matrix.lambda_key_prefix }}
          UPLOAD_TARGETS: ${{ join(matrix.artifact_targets, ' ') }}
          DEPLOY_ENV_LABEL: staging
        run: bash .github/scripts/upload-lambda-zips.sh
      - name: Update TFE variable + trigger staging run
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: node .github/scripts/deploy-tfe.js ${{ matrix.tfe_workspace }} ${GITHUB_SHA::7} "${{ join(matrix.lambda_functions, ',') }}" "${{ matrix.lambda_key_prefix }}"

  # ── Phase 4: Manual approval gate ────────────────────────────────────────────
  approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: [deploy-staging, detect-changes]
    if: (needs.detect-changes.outputs.matrix_staging || '[]') != '[]'
    environment: ${{ vars.PRODUCTION_ENVIRONMENT || 'production' }}
    steps:
      - run: echo "Approved for production"

  # ── Phase 5: Deploy to production ────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production (${{ matrix.client }})
    runs-on: ubuntu-latest
    needs: [approval, detect-changes]
    if: (needs.detect-changes.outputs.matrix_prod || '[]') != '[]'
    environment: ${{ vars.PRODUCTION_ENVIRONMENT || 'production' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix_prod || '[]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all apps in workspace
        run: |
          for app in ${{ join(matrix.apps, ' ') }}; do
            echo "Building $app..."
            APP=$app pnpm build:app
          done
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.role_to_assume }}
          aws-region: ${{ matrix.region }}
      - name: Upload Lambda zips to S3
        env:
          CLIENT: ${{ matrix.client }}
          S3_BUCKET: ${{ matrix.s3_bucket }}
          S3_KMS_KEY_ID: ${{ matrix.kms_key_id }}
          LAMBDA_KEY_PREFIX: ${{ matrix.lambda_key_prefix }}
          UPLOAD_TARGETS: ${{ join(matrix.artifact_targets, ' ') }}
          DEPLOY_ENV_LABEL: production
        run: bash .github/scripts/upload-lambda-zips.sh
      - name: Update TFE variable + trigger production run
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: node .github/scripts/deploy-tfe.js ${{ matrix.tfe_workspace }} ${GITHUB_SHA::7} "${{ join(matrix.lambda_functions, ',') }}" "${{ matrix.lambda_key_prefix }}"
