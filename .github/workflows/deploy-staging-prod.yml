name: Deploy — Staging → Prod

on:
  push:
    branches: [main]

jobs:
  # ── Phase 1: CI checks ───────────────────────────────────────────────────────
  checks:
    uses: ./.github/workflows/shared-checks.yml

  # ── Phase 2: Detect which workspaces need deploying ──────────────────────────
  detect-changes:
    name: Detect Changed Workspaces
    runs-on: ubuntu-latest
    needs: [checks]
    outputs:
      matrix_staging: ${{ steps.staging.outputs.matrix }}
      matrix_prod: ${{ steps.prod.outputs.matrix }}
      has_changes: ${{ steps.staging.outputs.matrix != '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            libs:
              - 'libs/**'
            apps:
              - 'apps/**'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build staging matrix
        id: staging
        env:
          DEPLOY_ENV: staging
          CHANGED_FILES: "${{ steps.filter.outputs.libs_files }} ${{ steps.filter.outputs.apps_files }}"
          LIBS_CHANGED: "${{ steps.filter.outputs.libs }}"
          S3_FORGE_CORE_STAGING: ${{ vars.S3_FORGE_CORE_STAGING }}
        run: echo "matrix=$(node .github/scripts/build-matrix.js)" >> $GITHUB_OUTPUT

      - name: Build prod matrix
        id: prod
        env:
          DEPLOY_ENV: prod
          CHANGED_FILES: "${{ steps.filter.outputs.libs_files }} ${{ steps.filter.outputs.apps_files }}"
          LIBS_CHANGED: "${{ steps.filter.outputs.libs }}"
          S3_FORGE_CORE_PROD: ${{ vars.S3_FORGE_CORE_PROD }}
        run: echo "matrix=$(node .github/scripts/build-matrix.js)" >> $GITHUB_OUTPUT

  # ── Phase 3: Build + deploy to staging ───────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.matrix_staging != '[]'
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix_staging) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all apps in workspace
        run: |
          for app in ${{ join(matrix.apps, ' ') }}; do
            echo "Building $app..."
            APP=$app pnpm build:app
          done
      - name: Upload Lambda zips to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          for app in ${{ join(matrix.apps, ' ') }}; do
            zip -j ${app}.zip dist/lambda/${app}/handler.js
            aws s3 cp ${app}.zip s3://${{ matrix.s3_bucket }}/${{ matrix.lambda_key_prefix }}/${app}-${SHORT_SHA}.zip
            rm ${app}.zip
          done
      - name: Update TFE variable + trigger staging run
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: node .github/scripts/deploy-tfe.js ${{ matrix.tfe_workspace }} ${GITHUB_SHA::7}

  # ── Phase 4: Manual approval gate ────────────────────────────────────────────
  approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: [deploy-staging, detect-changes]
    if: needs.detect-changes.outputs.matrix_staging != '[]'
    environment: ${{ vars.PRODUCTION_ENVIRONMENT || 'production' }}
    steps:
      - run: echo "Approved for production"

  # ── Phase 5: Deploy to production ────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    needs: [approval, detect-changes]
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix_prod) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all apps in workspace
        run: |
          for app in ${{ join(matrix.apps, ' ') }}; do
            echo "Building $app..."
            APP=$app pnpm build:app
          done
      - name: Upload Lambda zips to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          for app in ${{ join(matrix.apps, ' ') }}; do
            zip -j ${app}.zip dist/lambda/${app}/handler.js
            aws s3 cp ${app}.zip s3://${{ matrix.s3_bucket }}/${{ matrix.lambda_key_prefix }}/${app}-${SHORT_SHA}.zip
            rm ${app}.zip
          done
      - name: Update TFE variable + trigger production run
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: node .github/scripts/deploy-tfe.js ${{ matrix.tfe_workspace }} ${GITHUB_SHA::7}
