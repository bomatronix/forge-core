name: Migrate

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod
      client:
        description: Client to migrate
        required: true
        default: mindrithm
        type: choice
        options:
          - mindrithm
      action:
        description: Migration action
        required: true
        default: bootstrap-and-migrate
        type: choice
        options:
          - bootstrap-and-migrate
          - migrate

jobs:
  migrate:
    name: Run migrations (${{ inputs.client }} ${{ inputs.env }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'dev' && 'development' || inputs.env == 'prod' && 'production' || inputs.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve client config
        id: config
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs')
          const client = process.env.CLIENT
          const env = process.env.DEPLOY_ENV
          const config = JSON.parse(fs.readFileSync('.github/clients.json', 'utf8'))
          const clientConfig = config[client]
          if (!clientConfig) {
            throw new Error(`No config found for client '${client}'`)
          }
          const firstSet = (...values) => values.find((value) => typeof value === 'string' && value.trim() !== '')?.trim()
          const envConfig = clientConfig[env] ?? {}
          const accountId = firstSet(envConfig.account_id, clientConfig.account_id, process.env.AWS_ACCOUNT_ID)
          const roleToAssume =
            firstSet(envConfig.role_to_assume, process.env.AWS_ROLE_TO_ASSUME) ??
            (accountId ? `arn:aws:iam::${accountId}:role/${client}-${env}-role-artifact-publisher` : '')
          const region = firstSet(envConfig.region, process.env.AWS_REGION_FALLBACK) ?? 'us-east-1'
          const migratorFunction =
            firstSet(envConfig.migrator_function, process.env.MIGRATOR_FUNCTION_NAME) ??
            `${client}-core-migrator-${env}`

          if (!roleToAssume) {
            throw new Error(`No role_to_assume configured for client '${client}' env '${env}'. Add .github/clients.json ${client}.${env}.role_to_assume or set AWS_ACCOUNT_ID/AWS_ROLE_TO_ASSUME.`)
          }

          console.log(`role_to_assume=${roleToAssume}`)
          console.log(`region=${region}`)
          console.log(`migrator_function=${migratorFunction}`)
          NODE
        env:
          CLIENT: ${{ inputs.client }}
          DEPLOY_ENV: ${{ inputs.env }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '889851937279' }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_REGION_FALLBACK: ${{ vars.AWS_REGION || 'us-east-1' }}
          MIGRATOR_FUNCTION_NAME: ${{ vars.MIGRATOR_FUNCTION_NAME }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role_to_assume }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Invoke migrator
        env:
          MIGRATION_ACTION: ${{ inputs.action }}
          FUNCTION_NAME: ${{ steps.config.outputs.migrator_function }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg action "$MIGRATION_ACTION" '{action: $action}')
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload "$payload" \
            --cli-binary-format raw-in-base64-out \
            response.json \
            > invoke.json

          echo "Invoke metadata:"
          cat invoke.json | jq .
          echo "Migration response:"
          cat response.json | jq .

          if jq -e '.FunctionError?' invoke.json >/dev/null; then
            echo "::error::Migrator Lambda returned a function error"
            exit 1
          fi

          jq -e '.ok == true' response.json >/dev/null
