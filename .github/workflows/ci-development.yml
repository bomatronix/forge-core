name: CI/CD — Development

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  # ── CI checks ────────────────────────────────────────────────────────────────
  checks:
    uses: ./.github/workflows/shared-checks.yml

  # ── Detect changed workspaces ────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Workspaces
    runs-on: ubuntu-latest
    needs: [checks]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            libs:
              - 'libs/**'
            apps:
              - 'apps/**'
            deploy_config:
              - '.github/clients.json'
              - '.github/deploy.json'
              - '.github/scripts/**'
              - '.github/workflows/**'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build deployment matrix
        id: set-matrix
        env:
          DEPLOY_ENV: dev
          CHANGED_FILES: "${{ steps.filter.outputs.libs_files }} ${{ steps.filter.outputs.apps_files }} ${{ steps.filter.outputs.deploy_config_files }}"
          LIBS_CHANGED: "${{ steps.filter.outputs.libs }}"
          DEPLOY_CONFIG_CHANGED: "${{ steps.filter.outputs.deploy_config }}"
        run: |
          matrix="$(node .github/scripts/build-matrix.js)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ── Deploy to dev ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Dev (${{ matrix.client }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.event_name == 'push' && (needs.detect-changes.outputs.matrix || '[]') != '[]'
    environment: development
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix || '[]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all apps in workspace
        run: |
          for app in ${{ join(matrix.apps, ' ') }}; do
            echo "Building $app..."
            APP=$app pnpm build:app
          done
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.role_to_assume }}
          aws-region: ${{ matrix.region }}
      - name: Upload Lambda zips to S3
        env:
          CLIENT: ${{ matrix.client }}
          S3_BUCKET: ${{ matrix.s3_bucket }}
          S3_KMS_KEY_ID: ${{ matrix.kms_key_id }}
          LAMBDA_KEY_PREFIX: ${{ matrix.lambda_key_prefix }}
          UPLOAD_TARGETS: ${{ join(matrix.artifact_targets, ' ') }}
          DEPLOY_ENV_LABEL: development
        run: bash .github/scripts/upload-lambda-zips.sh
      - name: Update TFE variable + trigger dev run
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: node .github/scripts/deploy-tfe.js ${{ matrix.tfe_workspace }} ${GITHUB_SHA::7} "${{ join(matrix.lambda_functions, ',') }}" "${{ matrix.lambda_key_prefix }}"
      - name: Verify deployed lambdas
        run: node .github/scripts/verify-deployment.js dev ${{ matrix.client }}

  # ── Newman API smoke ──────────────────────────────────────────────────────
  newman-smoke:
    name: Newman API Smoke (Dev)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://api.dev.mindrithm.ai/api/health)
            if [ "$status" != "000" ] && [ -n "$status" ]; then echo "API ready (got $status)"; exit 0; fi
            echo "Attempt $i: got $status, waiting 10s..."
            sleep 10
          done
          echo "API did not become ready in time" && exit 1
      - name: Run Newman smoke tests
        run: pnpm test:newman:dev
      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: results/newman.xml
          retention-days: 14
      - name: Write job summary
        if: always()
        run: |
          echo "## Newman Smoke Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('results/newman.xml')) { console.log('No results file found'); process.exit(0); }
            const xml = fs.readFileSync('results/newman.xml', 'utf8');
            const sum = tag => (xml.match(new RegExp(tag + '=\"(\\\\d+)\"', 'g')) || []).map(m => parseInt(m.match(/\d+/)[0])).reduce((a,b)=>a+b,0);
            const tests = sum('tests'), failures = sum('failures'), errors = sum('errors');
            const icon = failures + errors === 0 ? '✅' : '❌';
            console.log(icon + ' ' + tests + ' assertions — ' + failures + ' failures, ' + errors + ' errors');
          " >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`dev (api.dev.mindrithm.ai)\`" >> $GITHUB_STEP_SUMMARY
          echo "**Collection:** \`forge-core.postman_collection.json\`" >> $GITHUB_STEP_SUMMARY
