name: CI/CD — Development

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  # ── CI checks ────────────────────────────────────────────────────────────────
  checks:
    uses: ./.github/workflows/shared-checks.yml

  # ── Detect changed workspaces ────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Workspaces
    runs-on: ubuntu-latest
    needs: [checks]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            libs:
              - 'libs/**'
            apps:
              - 'apps/**'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build deployment matrix
        id: set-matrix
        env:
          DEPLOY_ENV: dev
          CLIENT: ${{ vars.CLIENT }}
          CHANGED_FILES: "${{ steps.filter.outputs.libs_files }} ${{ steps.filter.outputs.apps_files }}"
          LIBS_CHANGED: "${{ steps.filter.outputs.libs }}"
        run: echo "matrix=$(node .github/scripts/build-matrix.js)" >> $GITHUB_OUTPUT

  # ── Deploy to dev ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Dev (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.event_name == 'push' && (needs.detect-changes.outputs.matrix || '[]') != '[]'
    environment: development
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix || '[]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all apps in workspace
        run: |
          for app in ${{ join(matrix.apps, ' ') }}; do
            echo "Building $app..."
            APP=$app pnpm build:app
          done
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
      - name: Upload Lambda zips to S3
        env:
          S3_BUCKET: ${{ vars.S3_FORGE_CORE }}
          S3_KMS_KEY_ID: ${{ vars.S3_KMS_KEY_ID }}
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::S3_FORGE_CORE is not set for the development environment"
            exit 1
          fi
          SHORT_SHA=${GITHUB_SHA::7}
          for app in ${{ join(matrix.apps, ' ') }}; do
            artifact_path="dist/lambda/${app}/handler.js"
            object_key="${{ matrix.lambda_key_prefix }}/${app}-${SHORT_SHA}.zip"
            if [ ! -f "$artifact_path" ]; then
              echo "::error::Missing built artifact $artifact_path for app '$app'"
              exit 1
            fi
            zip -j ${app}.zip "$artifact_path"
            s3_args=(--sse aws:kms)
            if [ -n "$S3_KMS_KEY_ID" ]; then
              s3_args+=(--sse-kms-key-id "$S3_KMS_KEY_ID")
            fi
            if aws s3api head-object --bucket "$S3_BUCKET" --key "$object_key" >/dev/null 2>&1; then
              echo "Skipping existing s3://$S3_BUCKET/$object_key"
              rm ${app}.zip
              continue
            fi
            echo "Uploading ${app}.zip to s3://$S3_BUCKET/$object_key"
            aws s3 cp ${app}.zip s3://$S3_BUCKET/$object_key "${s3_args[@]}"
            echo "Uploaded s3://$S3_BUCKET/$object_key"
            rm ${app}.zip
          done
      - name: Update TFE variable + trigger dev run
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: node .github/scripts/deploy-tfe.js ${{ matrix.tfe_workspace }} ${GITHUB_SHA::7} "${{ join(matrix.apps, ',') }}" "${{ matrix.lambda_key_prefix }}"
